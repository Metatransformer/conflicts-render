<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D World Conflicts Globe - March 2026</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; color: #e2e8f0; }
        canvas { display: block; cursor: grab; }
        canvas:active { cursor: grabbing; }

        /* Drag hint overlay */
        #drag-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 200;
            text-align: center;
            transition: opacity 1.2s ease-out;
        }
        #drag-hint.hidden { opacity: 0; }
        .drag-hint-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 12px;
            border: 2px solid rgba(147, 197, 253, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: hintPulse 2s ease-in-out infinite;
            background: rgba(10, 18, 35, 0.5);
        }
        .drag-hint-icon svg { width: 32px; height: 32px; }
        .drag-hint-text {
            font-size: 14px;
            color: rgba(147, 197, 253, 0.8);
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
            letter-spacing: 0.5px;
        }
        .drag-hint-sub {
            font-size: 11px;
            color: rgba(100, 116, 139, 0.8);
            margin-top: 4px;
        }
        @keyframes hintPulse {
            0%, 100% { transform: scale(1); border-color: rgba(147, 197, 253, 0.3); }
            50% { transform: scale(1.08); border-color: rgba(147, 197, 253, 0.7); }
        }
        @keyframes hintSway {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(8px); }
            75% { transform: translateX(-8px); }
        }
        .drag-hint-icon { animation: hintPulse 2s ease-in-out infinite, hintSway 3s ease-in-out infinite; }

        /* Panel */
        #panel {
            position: absolute;
            top: 16px;
            left: 16px;
            width: 340px;
            background: rgba(10, 18, 35, 0.92);
            border-radius: 14px;
            padding: 18px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
            z-index: 100;
            max-height: calc(100vh - 32px);
            overflow-y: auto;
            border: 1px solid rgba(71, 85, 105, 0.5);
            backdrop-filter: blur(12px);
        }
        #panel::-webkit-scrollbar { width: 5px; }
        #panel::-webkit-scrollbar-track { background: transparent; }
        #panel::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

        #panel h1 {
            font-size: 17px;
            color: #93c5fd;
            text-align: center;
            margin-bottom: 4px;
            letter-spacing: 0.3px;
        }
        .subtitle {
            text-align: center;
            font-size: 12px;
            color: #64748b;
            margin-bottom: 14px;
        }

        .legend {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            color: #94a3b8;
            cursor: pointer;
            padding: 3px 8px;
            border-radius: 12px;
            transition: background 0.2s;
        }
        .legend-item:hover { background: rgba(51, 65, 85, 0.5); }
        .legend-item.dimmed { opacity: 0.35; }
        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .filter-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .filter-btn {
            background: rgba(51, 65, 85, 0.4);
            border: 1px solid rgba(71, 85, 105, 0.4);
            color: #94a3b8;
            padding: 4px 10px;
            border-radius: 14px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn:hover, .filter-btn.active {
            background: rgba(59, 130, 246, 0.2);
            border-color: #3b82f6;
            color: #e2e8f0;
        }

        #conflicts-list { list-style: none; }
        #conflicts-list li {
            padding: 10px 12px;
            margin-bottom: 5px;
            background: rgba(30, 41, 59, 0.5);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 3px solid transparent;
        }
        #conflicts-list li:hover {
            background: rgba(51, 65, 85, 0.7);
            transform: translateX(3px);
        }
        #conflicts-list li.active {
            background: rgba(59, 130, 246, 0.15);
            border-left-color: #3b82f6;
        }
        .li-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .li-name { flex: 1; }
        .li-severity {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.6;
        }

        .count-badge {
            text-align: center;
            font-size: 12px;
            color: #64748b;
            margin-top: 10px;
        }

        /* Info panel */
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(10, 18, 35, 0.95);
            color: #e2e8f0;
            padding: 18px;
            border-radius: 14px;
            width: 380px;
            max-height: 55vh;
            overflow-y: auto;
            display: none;
            border: 1px solid rgba(71, 85, 105, 0.5);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
            z-index: 100;
            backdrop-filter: blur(12px);
        }
        #info::-webkit-scrollbar { width: 4px; }
        #info::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        #info-close {
            position: absolute;
            top: 10px;
            right: 14px;
            background: none;
            border: none;
            color: #64748b;
            font-size: 18px;
            cursor: pointer;
        }
        #info-close:hover { color: #e2e8f0; }
        #info h2 { margin: 0 0 6px 0; font-size: 16px; display: flex; align-items: center; gap: 8px; }
        #info-severity-badge {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
        #info-desc { margin: 8px 0; font-size: 13px; line-height: 1.5; color: #cbd5e1; }
        .info-meta { font-size: 12px; color: #64748b; margin-top: 8px; }
        .info-meta span { color: #94a3b8; }
        .info-parties { margin-top: 6px; font-size: 12px; color: #94a3b8; }
        .info-parties strong { color: #cbd5e1; }

        /* Casualty stats in info panel */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 12px 0;
        }
        .stat-box {
            background: rgba(30, 41, 59, 0.6);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }
        .stat-value {
            font-size: 18px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.5px;
        }
        .stat-value.killed { color: #f87171; }
        .stat-value.wounded { color: #fb923c; }
        .stat-value.displaced { color: #fbbf24; }
        .stat-value.refugees { color: #60a5fa; }
        .stat-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #64748b;
            margin-top: 2px;
        }

        /* Incident feed in info panel */
        .incident-feed-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748b;
            margin: 14px 0 8px;
            border-top: 1px solid rgba(71, 85, 105, 0.3);
            padding-top: 10px;
        }
        .incident-item {
            display: flex;
            gap: 8px;
            padding: 6px 0;
            border-bottom: 1px solid rgba(51, 65, 85, 0.3);
            font-size: 12px;
            align-items: flex-start;
        }
        .incident-icon {
            flex-shrink: 0;
            width: 20px;
            text-align: center;
            font-size: 13px;
        }
        .incident-time {
            flex-shrink: 0;
            color: #475569;
            font-size: 10px;
            min-width: 40px;
            padding-top: 1px;
        }
        .incident-text { color: #94a3b8; line-height: 1.3; }
        .incident-text strong { color: #cbd5e1; font-weight: 500; }

        /* Live ticker at bottom */
        #ticker {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 32px;
            background: rgba(10, 18, 35, 0.9);
            border-top: 1px solid rgba(71, 85, 105, 0.3);
            z-index: 90;
            display: flex;
            align-items: center;
            overflow: hidden;
        }
        #ticker-label {
            background: #dc2626;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 4px 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            flex-shrink: 0;
            height: 100%;
            display: flex;
            align-items: center;
        }
        #ticker-label::after {
            content: '';
            width: 6px;
            height: 6px;
            background: #fff;
            border-radius: 50%;
            margin-left: 8px;
            animation: tickerBlink 1.5s ease-in-out infinite;
        }
        @keyframes tickerBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }
        #ticker-content {
            flex: 1;
            white-space: nowrap;
            font-size: 12px;
            color: #94a3b8;
            padding: 0 16px;
            animation: tickerScroll 30s linear infinite;
        }
        #ticker-content strong { color: #e2e8f0; }
        @keyframes tickerScroll {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        .credit {
            position: absolute;
            bottom: 38px;
            right: 12px;
            color: #475569;
            font-size: 11px;
            z-index: 10;
        }

        @media (max-width: 768px) {
            #panel { width: calc(100vw - 32px); max-height: 35vh; }
            #info { width: calc(100vw - 32px); bottom: 38px; left: 10px; max-height: 40vh; }
        }
    </style>
</head>

    function createMarkers(radius) {
        markerMeshes = [];
        conflicts.forEach((conflict, index) => {
            const sev = SEVERITY[conflict.severity];
            const pos = latLngToVector3(conflict.lat, conflict.lng, radius * 1.015);

            const markerGeo = new THREE.SphereGeometry(sev.size, 16, 16);
            const markerMat = new THREE.MeshBasicMaterial({ color: sev.color, transparent: true, opacity: 0.95 });
            const marker = new THREE.Mesh(markerGeo, markerMat);
            marker.position.copy(pos);
            marker.userData = { conflict, index };

            // Glow ring
            const ringGeo = new THREE.RingGeometry(sev.size * 1.5, sev.size * 2.0, 32);
            const ringMat = new THREE.MeshBasicMaterial({ color: sev.color, side: THREE.DoubleSide, transparent: true, opacity: 0.3 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.lookAt(new THREE.Vector3(0, 0, 0));
            marker.add(ring);

            // Pulse ring
            const pulseGeo = new THREE.RingGeometry(sev.size * 2.0, sev.size * 2.3, 32);
            const pulseMat = new THREE.MeshBasicMaterial({ color: sev.color, side: THREE.DoubleSide, transparent: true, opacity: 0.0 });
            const pulse = new THREE.Mesh(pulseGeo, pulseMat);
            pulse.lookAt(new THREE.Vector3(0, 0, 0));
            pulse.name = 'pulse';
            marker.add(pulse);

            globeGroup.add(marker);
            markerMeshes.push(marker);
        });
    }

    function latLngToVector3(lat, lng, radius) {
        const phi = (90 - lat) * (Math.PI / 180);
        const theta = (lng + 180) * (Math.PI / 180);
        return new THREE.Vector3(
            -radius * Math.sin(phi) * Math.cos(theta),
            radius * Math.cos(phi),
            radius * Math.sin(phi) * Math.sin(theta)
        );
    }

    // ==================== INCIDENT SIMULATION ====================

    function spawnExplosion(conflict) {
        const basePos = latLngToVector3(
            conflict.lat + (Math.random() - 0.5) * 2,
            conflict.lng + (Math.random() - 0.5) * 2,
            GLOBE_RADIUS * 1.02
        );
        const sev = SEVERITY[conflict.severity];
        const count = conflict.severity === 'critical' ? 12 : conflict.severity === 'high' ? 8 : 5;

        // Flash
        const flashGeo = new THREE.SphereGeometry(0.15, 8, 8);
        const flashMat = new THREE.MeshBasicMaterial({ color: 0xffaa44, transparent: true, opacity: 1.0 });
        const flash = new THREE.Mesh(flashGeo, flashMat);
        flash.position.copy(basePos);
        globeGroup.add(flash);
        explosionParticles.push({ mesh: flash, life: 0.3, maxLife: 0.3, type: 'flash', vel: new THREE.Vector3() });

        // Burst particles
        for (let i = 0; i < count; i++) {
            const size = 0.02 + Math.random() * 0.03;
            const geo = new THREE.SphereGeometry(size, 6, 6);
            const color = Math.random() > 0.5 ? sev.color : 0xff6622;
            const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9 });
            const particle = new THREE.Mesh(geo, mat);
            particle.position.copy(basePos);

            // Velocity outward from surface
            const normal = basePos.clone().normalize();
            const vel = new THREE.Vector3(
                (Math.random() - 0.5) * 0.08,
                (Math.random() - 0.5) * 0.08,
                (Math.random() - 0.5) * 0.08
            ).add(normal.multiplyScalar(0.04 + Math.random() * 0.06));

            globeGroup.add(particle);
            explosionParticles.push({
                mesh: particle,
                vel,
                life: 0.8 + Math.random() * 0.8,
                maxLife: 0.8 + Math.random() * 0.8,
                type: 'particle'
            });
        }

        // Rising smoke
        for (let i = 0; i < 4; i++) {
            const size = 0.04 + Math.random() * 0.04;
            const geo = new THREE.SphereGeometry(size, 6, 6);
            const mat = new THREE.MeshBasicMaterial({ color: 0x444444, transparent: true, opacity: 0.5 });
            const smoke = new THREE.Mesh(geo, mat);
            const offset = basePos.clone().normalize().multiplyScalar(0.05 * i);
            smoke.position.copy(basePos).add(offset);

            const normal = basePos.clone().normalize();
            const vel = normal.multiplyScalar(0.015 + Math.random() * 0.01);

            globeGroup.add(smoke);
            smokeParticles.push({
                mesh: smoke,
                vel,
                life: 2.0 + Math.random() * 1.5,
                maxLife: 2.0 + Math.random() * 1.5,
                type: 'smoke'
            });
        }
    }

    function updateParticles(dt) {
        // Explosion particles
        for (let i = explosionParticles.length - 1; i >= 0; i--) {
            const p = explosionParticles[i];
            p.life -= dt;
            if (p.life <= 0) {
                globeGroup.remove(p.mesh);
                p.mesh.geometry.dispose();
                p.mesh.material.dispose();
                explosionParticles.splice(i, 1);
                continue;
            }
            const t = p.life / p.maxLife;
            p.mesh.material.opacity = t * (p.type === 'flash' ? 1.0 : 0.8);
            if (p.type === 'flash') {
                const s = 1.0 + (1.0 - t) * 2.0;
                p.mesh.scale.set(s, s, s);
            } else {
                p.mesh.position.add(p.vel.clone().multiplyScalar(dt));
                p.vel.multiplyScalar(0.97);
            }
        }

        // Smoke
        for (let i = smokeParticles.length - 1; i >= 0; i--) {
            const p = smokeParticles[i];
            p.life -= dt;
            if (p.life <= 0) {
                globeGroup.remove(p.mesh);
                p.mesh.geometry.dispose();
                p.mesh.material.dispose();
                smokeParticles.splice(i, 1);
                continue;
            }
            const t = p.life / p.maxLife;
            p.mesh.material.opacity = t * 0.35;
            const s = 1.0 + (1.0 - t) * 1.5;
            p.mesh.scale.set(s, s, s);
            p.mesh.position.add(p.vel.clone().multiplyScalar(dt));
        }
    }

    // Schedule incident explosions
    function startIncidentSimulation() {
        conflicts.forEach(conflict => {
            if (conflict.incidentRate <= 0) return;
            // Map incidentRate/month to seconds between events (accelerated: 1 month = ~60 seconds)
            const intervalSec = 60 / (conflict.incidentRate / 30) * 1000;
            const minInterval = conflict.severity === 'critical' ? 800 : conflict.severity === 'high' ? 1500 : 3000;
            const actualInterval = Math.max(minInterval, Math.min(intervalSec, 12000));

            function scheduleNext() {
                const jitter = actualInterval * (0.5 + Math.random());
                setTimeout(() => {
                    if (isConflictVisible(conflict)) {
                        spawnExplosion(conflict);
                    }
                    scheduleNext();
                }, jitter);
            }
            // Stagger initial spawn
            setTimeout(scheduleNext, Math.random() * actualInterval);
        });
    }

    // ==================== LIVE TICKER ====================
    let tickerMessages = [];
    let tickerIndex = 0;

    function generateIncidentMessage(conflict) {
        if (!conflict.incidents.length) return null;
        const type = conflict.incidents[Math.floor(Math.random() * conflict.incidents.length)];
        const incType = INCIDENT_TYPES[type];
        if (!incType) return null;
        const template = incType.templates[Math.floor(Math.random() * incType.templates.length)];
        const loc = conflict.locations[Math.floor(Math.random() * conflict.locations.length)];
        const n = Math.floor(50 + Math.random() * 500);
        const text = template.replace('{loc}', loc).replace('{n}', n);
        const casualties = conflict.severity === 'critical'
            ? Math.floor(3 + Math.random() * 25)
            : conflict.severity === 'high'
            ? Math.floor(1 + Math.random() * 12)
            : Math.floor(1 + Math.random() * 5);
        const casualtyText = type === 'displacement' || type === 'kidnapping'
            ? '' : ` — ${casualties} reported killed`;
        return `${incType.icon} <strong>${conflict.name}:</strong> ${text}${casualtyText}`;
    }

    function startTicker() {
        // Pre-generate messages
        for (let i = 0; i < 40; i++) {
            const conflict = conflicts.filter(c => c.incidentRate > 0)[Math.floor(Math.random() * conflicts.filter(c => c.incidentRate > 0).length)];
            const msg = generateIncidentMessage(conflict);
            if (msg) tickerMessages.push(msg);
        }
        updateTickerContent();

        // Continuously add new messages
        setInterval(() => {
            const activeConflicts = conflicts.filter(c => c.incidentRate > 0 && isConflictVisible(c));
            if (!activeConflicts.length) return;
            const conflict = activeConflicts[Math.floor(Math.random() * activeConflicts.length)];
            const msg = generateIncidentMessage(conflict);
            if (msg) {
                tickerMessages.push(msg);
                if (tickerMessages.length > 60) tickerMessages.shift();
                updateTickerContent();
            }
        }, 4000);
    }

    function updateTickerContent() {
        const el = document.getElementById('ticker-content');
        const separator = '&nbsp;&nbsp;&nbsp;&#x2022;&nbsp;&nbsp;&nbsp;';
        el.innerHTML = tickerMessages.slice(-20).join(separator);
    }

    // ==================== UI ====================
    function buildLegend() {
        const legend = document.getElementById('legend');
        Object.entries(SEVERITY).forEach(([key, sev]) => {
            const count = conflicts.filter(c => c.severity === key).length;
            const item = document.createElement('div');
            item.className = 'legend-item';
            item.dataset.severity = key;
            item.innerHTML = `<span class="legend-dot" style="background:${sev.cssColor}"></span>${sev.label} (${count})`;
            item.onclick = () => {
                if (activeSeverityFilters.has(key)) {
                    activeSeverityFilters.delete(key);
                    item.classList.add('dimmed');
                } else {
                    activeSeverityFilters.add(key);
                    item.classList.remove('dimmed');
                }
                updateVisibility();
                buildConflictList();
            };
            legend.appendChild(item);
        });
    }

    function buildFilterBar() {
        const bar = document.getElementById('filter-bar');
        const allBtn = document.createElement('button');
        allBtn.className = 'filter-btn active';
        allBtn.textContent = 'All';
        allBtn.onclick = () => setFilter('all');
        bar.appendChild(allBtn);

        [...new Set(conflicts.map(c => c.region))].sort().forEach(region => {
            const btn = document.createElement('button');
            btn.className = 'filter-btn';
            btn.textContent = region;
            btn.onclick = () => setFilter(region);
            bar.appendChild(btn);
        });
    }

    function setFilter(filter) {
        activeFilter = filter;
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.classList.toggle('active', btn.textContent === (filter === 'all' ? 'All' : filter));
        });
        updateVisibility();
        buildConflictList();
    }

    function isConflictVisible(conflict) {
        return activeSeverityFilters.has(conflict.severity) && (activeFilter === 'all' || conflict.region === activeFilter);
    }

    function updateVisibility() {
        markerMeshes.forEach(marker => {
            marker.visible = isConflictVisible(marker.userData.conflict);
        });
    }

    function buildConflictList() {
        const list = document.getElementById('conflicts-list');
        list.innerHTML = '';
        const visible = conflicts.filter(isConflictVisible);

        visible.forEach(conflict => {
            const sev = SEVERITY[conflict.severity];
            const li = document.createElement('li');
            li.innerHTML = `
                <span class="li-dot" style="background:${sev.cssColor}"></span>
                <span class="li-name">${conflict.name}</span>
                <span class="li-severity">${sev.label}</span>
            `;
            li.onclick = () => focusOnConflict(conflict, li);
            list.appendChild(li);
        });

        document.getElementById('count-badge').textContent = `Showing ${visible.length} of ${conflicts.length} conflicts`;
    }

    function formatNumber(n) {
        if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
        if (n >= 1000) return (n / 1000).toFixed(n >= 10000 ? 0 : 1) + 'K';
        return n.toLocaleString();
    }

    function focusOnConflict(conflict, listItem) {
        targetRotationY = -THREE.MathUtils.degToRad(conflict.lng) + 0.3;
        targetRotationX = THREE.MathUtils.degToRad(conflict.lat * 0.35);
        animatingToTarget = true;

        document.querySelectorAll('#conflicts-list li').forEach(li => li.classList.remove('active'));
        if (listItem) listItem.classList.add('active');

        showInfoPanel(conflict);
    }

    function showInfoPanel(conflict) {
        const sev = SEVERITY[conflict.severity];
        document.getElementById('info-name').textContent = conflict.name;
        const badge = document.getElementById('info-severity-badge');
        badge.textContent = sev.label;
        badge.style.background = sev.cssColor + '22';
        badge.style.color = sev.cssColor;
        document.getElementById('info-desc').textContent = conflict.desc;

        // Stats grid
        const stats = document.getElementById('info-stats');
        const c = conflict.casualties;
        stats.innerHTML = '';
        if (c.killed > 0) stats.innerHTML += `<div class="stat-box"><div class="stat-value killed">${formatNumber(c.killed)}</div><div class="stat-label">Killed</div></div>`;
        if (c.wounded > 0) stats.innerHTML += `<div class="stat-box"><div class="stat-value wounded">${formatNumber(c.wounded)}</div><div class="stat-label">Wounded</div></div>`;
        if (c.displaced > 0) stats.innerHTML += `<div class="stat-box"><div class="stat-value displaced">${formatNumber(c.displaced)}</div><div class="stat-label">Displaced</div></div>`;
        if (c.refugees > 0) stats.innerHTML += `<div class="stat-box"><div class="stat-value refugees">${formatNumber(c.refugees)}</div><div class="stat-label">Refugees</div></div>`;

        document.getElementById('info-parties').innerHTML = `<strong>Parties:</strong> ${conflict.parties}`;
        document.getElementById('info-impact').innerHTML = `<strong>Impact:</strong> <span>${conflict.impact}</span>`;
        document.getElementById('info-started').innerHTML = `<strong>Started:</strong> <span>${conflict.started}</span>`;
        document.getElementById('info-region').innerHTML = `<strong>Region:</strong> <span>${conflict.region} &middot; ${CATEGORIES[conflict.category] || conflict.category}</span>`;

        // Incident feed
        const feedDiv = document.getElementById('info-incidents');
        if (conflict.incidents.length > 0) {
            let html = '<div class="incident-feed-title">Recent Incident Reports (Simulated)</div>';
            const now = new Date();
            for (let i = 0; i < Math.min(6, conflict.incidents.length + 2); i++) {
                const type = conflict.incidents[i % conflict.incidents.length];
                const incType = INCIDENT_TYPES[type];
                if (!incType) continue;
                const loc = conflict.locations[Math.floor(Math.random() * conflict.locations.length)];
                const template = incType.templates[Math.floor(Math.random() * incType.templates.length)];
                const n = Math.floor(50 + Math.random() * 500);
                const text = template.replace('{loc}', `<strong>${loc}</strong>`).replace('{n}', n);
                const minsAgo = Math.floor(Math.random() * 180) + (i * 30);
                const timeStr = minsAgo < 60 ? `${minsAgo}m` : `${Math.floor(minsAgo / 60)}h`;
                html += `<div class="incident-item">
                    <span class="incident-icon">${incType.icon}</span>
                    <span class="incident-time">${timeStr} ago</span>
                    <span class="incident-text">${text}</span>
                </div>`;
            }
            feedDiv.innerHTML = html;
        } else {
            feedDiv.innerHTML = '<div class="incident-feed-title">No active incidents</div>';
        }

        document.getElementById('info').style.display = 'block';
    }

    // ==================== INTERACTION ====================
    function dismissHint() {
        if (!hintDismissed) {
            hintDismissed = true;
            document.getElementById('drag-hint').classList.add('hidden');
            setTimeout(() => {
                const el = document.getElementById('drag-hint');
                if (el) el.style.display = 'none';
            }, 1200);
        }
    }

    function onMouseDown(e) {
        if (e.button === 0) {
            isDragging = true;
            dragMoved = false;
            previousMouseX = e.clientX;
            previousMouseY = e.clientY;
            animatingToTarget = false;
            dismissHint();
        }
    }

    function onMouseMove(e) {
        if (!isDragging) return;
        const deltaX = e.clientX - previousMouseX;
        const deltaY = e.clientY - previousMouseY;
        if (Math.abs(deltaX) > 2 || Math.abs(deltaY) > 2) dragMoved = true;

        globeGroup.rotation.y += deltaX * 0.005;
        globeGroup.rotation.x += deltaY * 0.005;
        globeGroup.rotation.x = Math.max(-1.2, Math.min(1.2, globeGroup.rotation.x));

        previousMouseX = e.clientX;
        previousMouseY = e.clientY;
    }

    function onMouseUp() { isDragging = false; }

    function onWheel(e) {
        camera.position.z += e.deltaY * 0.012;
        camera.position.z = Math.max(8, Math.min(camera.position.z, 25));
        dismissHint();
    }

    let lastTouchDist = 0;
    function onTouchStart(e) {
        dismissHint();
        if (e.touches.length === 1) {
            isDragging = true;
            dragMoved = false;
            previousMouseX = e.touches[0].clientX;
            previousMouseY = e.touches[0].clientY;
            animatingToTarget = false;
        } else if (e.touches.length === 2) {
            lastTouchDist = Math.hypot(
                e.touches[0].clientX - e.touches[1].clientX,
                e.touches[0].clientY - e.touches[1].clientY
            );
        }
        e.preventDefault();
    }

    function onTouchMove(e) {
        if (e.touches.length === 1 && isDragging) {
            const deltaX = e.touches[0].clientX - previousMouseX;
            const deltaY = e.touches[0].clientY - previousMouseY;
            if (Math.abs(deltaX) > 2 || Math.abs(deltaY) > 2) dragMoved = true;
            globeGroup.rotation.y += deltaX * 0.005;
            globeGroup.rotation.x += deltaY * 0.005;
            globeGroup.rotation.x = Math.max(-1.2, Math.min(1.2, globeGroup.rotation.x));
            previousMouseX = e.touches[0].clientX;
            previousMouseY = e.touches[0].clientY;
        } else if (e.touches.length === 2) {
            const dist = Math.hypot(
                e.touches[0].clientX - e.touches[1].clientX,
                e.touches[0].clientY - e.touches[1].clientY
            );
            camera.position.z += (lastTouchDist - dist) * 0.03;
            camera.position.z = Math.max(8, Math.min(camera.position.z, 25));
            lastTouchDist = dist;
        }
        e.preventDefault();
    }

    function onTouchEnd() { isDragging = false; }

    function onClick(e) {
        if (dragMoved) return;
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);

        const intersects = raycaster.intersectObjects(markerMeshes.filter(m => m.visible), true);
        if (intersects.length > 0) {
            let obj = intersects[0].object;
            while (obj && !obj.userData.conflict) obj = obj.parent;
            if (obj && obj.userData.conflict) {
                const conflict = obj.userData.conflict;
                showInfoPanel(conflict);
                const listItems = document.querySelectorAll('#conflicts-list li');
                listItems.forEach(li => li.classList.remove('active'));
                const idx = conflicts.filter(isConflictVisible).indexOf(conflict);
                if (idx >= 0 && listItems[idx]) listItems[idx].classList.add('active');
            }
        }
    }

    function onResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // ==================== ANIMATION ====================
    let lastTime = 0;
    function animate() {
        requestAnimationFrame(animate);
        const elapsed = clock.getElapsedTime();
        const dt = Math.min(elapsed - lastTime, 0.05);
        lastTime = elapsed;

        // Smooth rotation to target (from clicking a conflict in the list)
        if (animatingToTarget && targetRotationY !== null) {
            globeGroup.rotation.y += (targetRotationY - globeGroup.rotation.y) * 0.06;
            globeGroup.rotation.x += (targetRotationX - globeGroup.rotation.x) * 0.06;
            if (Math.abs(targetRotationY - globeGroup.rotation.y) < 0.005) {
                animatingToTarget = false;
            }
        }

        // NO auto-rotation — globe is static until user interacts

        // Cloud drift (very subtle)
        const clouds = globeGroup.getObjectByName('clouds');
        if (clouds) clouds.rotation.y += 0.00005;

        // Pulse animation on markers
        markerMeshes.forEach((marker, i) => {
            if (!marker.visible) return;
            const pulse = marker.getObjectByName('pulse');
            if (pulse) {
                const phase = (elapsed * 1.5 + i * 0.7) % 2.0;
                const scale = 1.0 + phase * 0.8;
                pulse.scale.set(scale, scale, 1);
                pulse.material.opacity = Math.max(0, 0.35 * (1.0 - phase / 2.0));
            }
        });

        // Update explosion/smoke particles
        updateParticles(dt);

        renderer.render(scene, camera);
    }

    // Start
    init();
    </script>
</body>
</html>
